services:
  postgres:
    image: postgres:16
    container_name: signalforge-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: signalforge
    ports:
      - "5434:5432"
    volumes:
      - signalforge_pgdata:/var/lib/postgresql/data

volumes:
  signalforge_pgdata: